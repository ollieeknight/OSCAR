title: "OSCAR Pipeline QC Report"

# Show all samples even if only one tool has data for them
skip_generalstats: false

# Collect whatever is present; no hard requirement on any module
run_modules:
  - fastp
  - cellranger
  - custom_content

# Module-specific settings
module_order:
  - fastp:
      name: "Read QC (fastp)"
  - cellranger

# Demux summary table emitted by DEMUX_QC as *_demux_mqc.csv. The section name
# and plot type are carried in the file's own header comments.
custom_data:
  oscar_demux:
    file_format: "csv"
sp:
  oscar_demux:
    fn: "*_demux_mqc.csv" 

extra_fn_clean_s_name:
  - "_S[0-9]+_L[0-9]+_R[12]_001$": ""
  - "_001$": ""

# Output
make_data_dir: true
export_plots: false
