site_name: OSCAR
site_description: Single-cell sequencing pipeline for the Romagnani Lab
site_url: https://ollieeknight.github.io/OSCAR/
repo_url: https://github.com/ollieeknight/OSCAR
repo_name: ollieeknight/OSCAR

docs_dir: docs-src
site_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - For the lab:
      - Metadata generator: tools/metadata_generator.html
      - Feature barcode generator: tools/adt_generator.html
      - Filling these in: guide/filling-these-in.md
  - Running OSCAR: guide/running.md
  - Maintaining OSCAR: reference/maintaining.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
